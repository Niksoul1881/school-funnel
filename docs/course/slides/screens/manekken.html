<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;font-family:Inter,sans-serif;background:#0c0c0e;color:#fff}
.st{height:50px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 6px;font-size:16px;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 18px}
.logo{font-size:22px;font-weight:900;letter-spacing:.08em}
.pill{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:#1d1d22;color:#c9c9d1}
.tabs{display:flex;gap:18px;padding:4px 18px 12px;font-size:14px;font-weight:800;letter-spacing:.06em;color:#6d6d78}
.tabs .on{color:#fff;border-bottom:2px solid #fff;padding-bottom:4px}
.hero{margin:0 14px;border-radius:22px;overflow:hidden;position:relative;height:430px;background:#f5f5f5}
.hero .img{position:absolute;inset:0;background:url(../assets/manekken_look.png) no-repeat;background-size:280% auto;background-position:42% 0%}
.hero .lab{position:absolute;left:14px;top:14px;font-size:12px;font-weight:800;letter-spacing:.08em;background:#0c0c0e;padding:6px 10px;border-radius:999px}
.hero .ai{position:absolute;right:14px;top:14px;font-size:12px;font-weight:800;background:linear-gradient(135deg,#a78bfa,#f472b6);padding:6px 10px;border-radius:999px}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.75));}
.hero .cap b{display:block;font-size:22px;font-weight:900;letter-spacing:-.02em}.hero .cap span{font-size:13px;color:#ddd}
.row{display:flex;gap:8px;padding:12px 14px}
.it{flex:1;height:96px;border-radius:14px;background:#f5f5f5;overflow:hidden}.it img{width:100%;height:100%;object-fit:cover}
.btn{margin:4px 14px;border-radius:16px;padding:16px;text-align:center;font-weight:900;font-size:16px;background:#fff;color:#0c0c0e}
.btn2{margin:8px 14px;border-radius:16px;padding:14px;text-align:center;font-weight:800;font-size:15px;background:#cb11ab;color:#fff}
</style></head><body>
<div class="st"><span>9:41</span><span>●●● ▮</span></div>
<div class="top"><div class="logo">FASHION GANG</div><div class="pill">Манекен · Mini App</div></div>
<div class="tabs"><span class="on">ОБРАЗЫ</span><span>ITEMS</span><span>AI</span></div>
<div class="hero"><div class="img"></div><span class="lab">ОБРАЗ ДНЯ</span><span class="ai">✨ собрал AI</span>
 <div class="cap"><b>Old money · осень</b><span>AI подобрал вещи к образу ↓</span></div></div>
<div class="row"><div class="it"><img src="../assets/mk_tee.png"></div><div class="it"><img src="../assets/mk_pants.png"></div><div class="it"><img src="../assets/mk_shoes.png"></div><div class="it"><img src="../assets/mk_bag.png" style="object-fit:contain;padding:10px"></div></div>
<div class="btn">Собрать свой образ</div>
<div class="btn2">Купить на Wildberries →</div>
</body></html>
