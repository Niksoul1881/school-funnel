<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Школа AI-агентов и платформа запуска — концепция</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b1a; --bg2:#101a3d; --ink:#f4f6ff; --muted:#a7b0d6; --dim:#7b86b3;
  --line:rgba(255,255,255,.13); --line2:rgba(255,255,255,.22);
  --glass:rgba(255,255,255,.055);
  --a1:#ff8a3d; --a2:#ff4f8b; --a3:#8b5cf6; --a4:#3ec7ff; --gold:#ffd166; --green:#3ddc97; --red:#ff6b6b;
  --acc:#8b5cf6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#04060f;color:var(--ink);font-family:Manrope,"Segoe UI",Arial,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(900px 600px at 50% 20%,#111a3a,#04060f 70%)}
.deck{width:1600px;height:900px;position:relative;transform-origin:center center;flex:none}
.slide{
  position:absolute;inset:0;width:1600px;height:900px;padding:52px 64px 58px;
  display:none;flex-direction:column;overflow:hidden;border-radius:2px;
  background:
    radial-gradient(900px 620px at 10% 6%, color-mix(in srgb, var(--acc) 30%, transparent), transparent 62%),
    radial-gradient(760px 560px at 94% 14%, color-mix(in srgb, var(--a2) 16%, transparent), transparent 64%),
    radial-gradient(900px 700px at 72% 108%, color-mix(in srgb, var(--a4) 15%, transparent), transparent 62%),
    linear-gradient(158deg,#070b1a 0%,#0c1430 55%,#101a3d 100%);
}
.slide.active{display:flex}
.slide::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.20;
  background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 52%,#000 28%,transparent 76%);
  mask-image:radial-gradient(ellipse at 50% 52%,#000 28%,transparent 76%);
}
.slide > *{position:relative;z-index:2}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:22px}
.kicker{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#dbe2ff;
  padding:8px 14px;border:1px solid var(--line2);border-radius:999px;background:rgba(255,255,255,.055)}
.kicker .dot{width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 14px var(--acc)}
.head .meta{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-align:right;line-height:1.6}
h1,h2,h3{font-family:Unbounded,Manrope,sans-serif;letter-spacing:-.01em}
h1{font-weight:800;font-size:54px;line-height:1.06}
h2{font-weight:700;font-size:38px;line-height:1.1}
h3{font-weight:600;font-size:22px;line-height:1.2}
.grad{background:linear-gradient(92deg,var(--a1),var(--a2) 46%,var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
.gold{color:var(--gold)}.acc{color:var(--acc)}.green{color:var(--green)}.muted{color:var(--muted)}
.sub{margin-top:14px;font-size:21px;line-height:1.42;color:var(--muted);font-weight:500;max-width:1250px}
.content{flex:1;min-height:0;display:flex;flex-direction:column}
.foot{position:absolute;left:64px;right:64px;bottom:20px;display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(167,176,214,.55);z-index:3}
.foot b{color:rgba(244,246,255,.8);font-weight:800}
.card{background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:20px;padding:22px 24px;box-shadow:0 24px 60px rgba(0,0,0,.22)}
.card.hl{border-color:color-mix(in srgb,var(--acc) 60%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 25%,transparent),0 24px 70px color-mix(in srgb,var(--acc) 18%,transparent)}
.card.goldc{border-color:rgba(255,209,102,.55);background:linear-gradient(180deg,rgba(255,209,102,.14),rgba(255,209,102,.03))}
.card p{font-size:17px;line-height:1.45;color:var(--muted);margin-top:8px}
.card h3{font-size:21px}
.card .num{font-family:Unbounded,sans-serif;font-weight:800;font-size:42px;line-height:1;color:var(--gold)}
.card .tiny{font-size:14px;line-height:1.4;color:var(--dim);margin-top:10px}
.ico{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.22),rgba(255,255,255,.03) 65%),#141c42;
  border:1px solid var(--line2);box-shadow:0 0 30px color-mix(in srgb,var(--acc) 35%,transparent)}
.ico svg{width:23px;height:23px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:34px;height:34px;border-radius:11px}.ico.sm svg{width:18px;height:18px}
.ico.lg{width:58px;height:58px;border-radius:18px}.ico.lg svg{width:30px;height:30px}
.row{display:flex;gap:18px;align-items:center}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.b{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;letter-spacing:.03em;padding:5px 10px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.06);color:#e7ebff;white-space:nowrap}
.b.green{background:rgba(61,220,151,.12);border-color:rgba(61,220,151,.4);color:#8ff0c6}
.b.gold{background:rgba(255,209,102,.12);border-color:rgba(255,209,102,.4);color:var(--gold)}
.b.blue{background:rgba(62,199,255,.12);border-color:rgba(62,199,255,.4);color:#9fe4ff}
.b.pink{background:rgba(255,79,139,.12);border-color:rgba(255,79,139,.4);color:#ffa7c6}
.b.violet{background:rgba(139,92,246,.16);border-color:rgba(139,92,246,.45);color:#c9b6ff}
.tbl{width:100%;border-collapse:collapse;font-size:16px}
.tbl th{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:800;text-align:left;padding:0 10px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 10px;border-bottom:1px solid rgba(255,255,255,.075);vertical-align:top;color:#e6eaff;font-weight:600}
.tbl tr:last-child td{border-bottom:0}
.tbl .m{color:var(--muted);font-weight:500}
.tbl .r{text-align:right;white-space:nowrap}
.tbl .big{font-family:Unbounded,sans-serif;font-weight:700;font-size:20px;color:var(--gold)}
.note{font-size:13px;line-height:1.5;color:var(--dim)}
.strip{margin-top:auto;display:flex;align-items:center;gap:16px;padding:16px 22px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(90deg,rgba(255,255,255,.075),rgba(255,255,255,.015));font-size:18px;font-weight:700;line-height:1.35}
.strip .ico{width:38px;height:38px;border-radius:12px}.strip .ico svg{width:20px;height:20px}
.flow{display:flex;align-items:stretch;gap:0}
.flow .step{flex:1;position:relative;padding:18px 16px;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:14px;min-width:0}
.flow .step + .step{margin-left:26px}
.flow .step + .step::before{content:"→";position:absolute;left:-24px;top:50%;transform:translateY(-50%);color:var(--acc);font-size:22px;font-weight:800}
.flow .step .t{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:800}
.flow .step .h{font-family:Unbounded,sans-serif;font-weight:600;font-size:17px;line-height:1.2;margin-top:6px}
.flow .step .d{font-size:13.5px;line-height:1.4;color:var(--muted);margin-top:6px}
.flow .step.on{border-color:color-mix(in srgb,var(--acc) 65%,transparent);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:Unbounded,sans-serif;font-weight:800;font-size:38px;line-height:1;color:#fff}
.kpi .l{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:800}
.kpi .s{font-size:13.5px;color:var(--muted);line-height:1.35}
.hr{height:1px;background:var(--line);margin:16px 0}
.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;position:relative;margin-top:10px}
.timeline::before{content:"";position:absolute;left:2px;right:2px;top:18px;height:2px;background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3),var(--a4))}
.timeline .ph{position:relative;padding-top:40px}
.timeline .ph::before{content:"";position:absolute;top:11px;left:0;width:14px;height:14px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 5px color-mix(in srgb,var(--acc) 20%,transparent),0 0 20px var(--acc)}
.timeline .ph .dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:800}
.timeline .ph .tt{font-family:Unbounded,sans-serif;font-weight:600;font-size:16px;line-height:1.2;margin-top:6px}
.timeline .ph .dd{font-size:13px;line-height:1.45;color:var(--muted);margin-top:6px}
.timeline .ph .gt{margin-top:8px;font-size:12px;color:#c9d2f5;border-left:2px solid var(--line2);padding-left:8px}
@page{size:13.333in 7.5in;margin:0}
@media print{
  html,body{overflow:visible!important;background:#04060f!important;display:block!important;height:auto!important}
  .stage{position:static!important;display:block!important;background:none!important}
  .deck{transform:none!important;width:1600px!important;height:auto!important}
  .slide{position:relative!important;display:flex!important;page-break-after:always;break-after:page;width:1600px!important;height:900px!important;border-radius:0;break-inside:avoid}
  .slide:last-child{page-break-after:auto;break-after:auto}
  .ui{display:none!important}
  .grad{background:none!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;color:#ff8a3d!important;-webkit-text-fill-color:#ff8a3d!important}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.ui{position:fixed;z-index:50;color:#cfd6f5;font-family:Manrope,sans-serif}
body.clean .ui{display:none!important}
.nav{right:22px;bottom:18px;display:flex;gap:8px;align-items:center}
.nav button{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(10,14,30,.72);color:#fff;font-size:17px;cursor:pointer;backdrop-filter:blur(8px)}
.nav button:hover{border-color:var(--a2)}
.counter{left:22px;bottom:18px;font-size:12px;letter-spacing:.14em;font-weight:800;color:rgba(207,214,245,.7);background:rgba(10,14,30,.6);padding:9px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.12)}
.hint{right:22px;top:18px;font-size:11px;color:rgba(207,214,245,.5);letter-spacing:.04em}
.progress{position:fixed;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3),var(--a4));width:0;z-index:60;transition:width .25s ease}
@media (max-width:700px){.hint{display:none}}
</style>
</head>
<body>

const deck = document.getElementById('deck');
deck.innerHTML = slides.map((s,i)=>`<section class="slide" data-i="${i}" style="--acc:${s.acc}">${s.html}</section>`).join('');
const nodes = [...deck.querySelectorAll('.slide')];
let cur = 0;
const counter = document.getElementById('counter');
const progress = document.getElementById('progress');
function show(n){
  cur = Math.max(0, Math.min(nodes.length-1, n));
  nodes.forEach((el,i)=>el.classList.toggle('active', i===cur));
  counter.textContent = String(cur+1).padStart(2,'0') + ' / ' + String(nodes.length).padStart(2,'0');
  progress.style.width = ((cur)/(nodes.length-1)*100)+'%';
  if (location.hash !== '#'+(cur+1)) history.replaceState(null,'','#'+(cur+1));
}
function fit(){
  const pad = 24;
  const sx = (window.innerWidth - pad*2) / 1600;
  const sy = (window.innerHeight - pad*2) / 900;
  const s = Math.min(sx, sy);
  deck.style.transform = 'scale('+s+')';
}
window.addEventListener('resize', fit);
document.getElementById('next').onclick = ()=>show(cur+1);
document.getElementById('prev').onclick = ()=>show(cur-1);
window.addEventListener('keydown', e=>{
  if (['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){ e.preventDefault(); show(cur+1); }
  else if (['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); show(cur-1); }
  else if (e.key === 'Home'){ show(0); }
  else if (e.key === 'End'){ show(nodes.length-1); }
  else if (e.key.toLowerCase() === 'f'){ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
  else if (e.key.toLowerCase() === 'p'){ e.preventDefault(); window.print(); }
});
document.querySelector('.stage').addEventListener('click', e=>{
  if (e.target.closest('.ui')) return;
  const r = e.currentTarget.getBoundingClientRect();
  if (e.clientX - r.left > r.width/2) show(cur+1); else show(cur-1);
});
const initial = parseInt((location.hash||'').replace('#','').replace(/^c/,''),10);
if((location.hash||'').replace('#','').startsWith('c')) document.body.classList.add('clean');
fit(); show(Number.isFinite(initial) && initial>0 ? initial-1 : 0);
</script>
